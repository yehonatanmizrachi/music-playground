<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תווים בקצב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=IBM+Plex+Mono:wght@500&family=Noto+Music&display=swap">
<style>
/* Layout: one narrow column — staff card on top, transport + tempo under it, settings folded below */
:root{
  --paper:#EEF0EC; --surface:#FFFFFF; --ink:#1A1F2B; --muted:#5B6270; --rule:#D4D8DD;
  --accent:#2D47B8; --accent-soft:#E3E8FA; --ok:#1F8A4C; --bad:#C2362B;
  --key-w:#FBFBF8; --key-b:#1E222A;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-music:"Noto Music","Bravura","Segoe UI Symbol","Apple Symbols",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111418; --surface:#1A1E24; --ink:#E6E8EC; --muted:#9AA1AD; --rule:#2F353F;
  --accent:#93A5FF; --accent-soft:#252D4D; --ok:#4CC27F; --bad:#FF6B5E;
  --key-w:#D9DBD6; --key-b:#0B0D10; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111418; --surface:#1A1E24; --ink:#E6E8EC; --muted:#9AA1AD; --rule:#2F353F;
  --accent:#93A5FF; --accent-soft:#252D4D; --ok:#4CC27F; --bad:#FF6B5E;
  --key-w:#D9DBD6; --key-b:#0B0D10; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{align-self:flex-start;font-size:.9rem;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:-6px}
.back:hover{color:var(--accent)}
h1{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0;letter-spacing:.01em}
.mic{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.dot.on{background:var(--ok)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:3px;gap:3px}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.staff{direction:ltr;width:100%;height:auto;display:block}
.label{font-family:var(--f-display);font-size:1.5rem;text-align:center;min-height:2.2rem}
.prompt{text-align:center;color:var(--muted);font-size:.95rem;min-height:1.4rem}
.prompt.ok{color:var(--ok);font-weight:700}
.prompt.bad{color:var(--bad);font-weight:700}
.beats{display:flex;justify-content:center;gap:8px;direction:ltr}
.beats i{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule);display:block}
.beats i.past{background:var(--accent);border-color:var(--accent)}
.beats i.now{background:var(--ink);border-color:var(--ink)}
.bar{height:4px;background:var(--accent-soft);border-radius:2px;overflow:hidden;direction:ltr}
.bar span{display:block;height:100%;width:0;background:var(--accent)}
.heard{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px}
.heard b{font-family:var(--f-mono);color:var(--ink);font-weight:500;min-width:3.5em;display:inline-block}
.meter{flex:1;height:6px;background:var(--accent-soft);border-radius:3px;overflow:hidden;direction:ltr;max-width:140px}
.meter span{display:block;height:100%;width:0;background:var(--muted)}
.transport{display:flex;gap:10px;align-items:stretch}
.go{flex:0 0 auto;font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:12px;padding:0 22px;background:var(--ink);color:var(--paper);cursor:pointer;min-height:64px}
.go.stop{background:var(--bad);color:#fff}
.tempo{flex:1;min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.tempo-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bpm{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.bpm small{font-size:.75rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:6px 4px}
.stats b{display:block;font-family:var(--f-mono);font-weight:500;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:4px 14px}
summary{cursor:pointer;font-weight:700;padding:8px 0}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row label{font-weight:600}
.row .hint{font-size:.8rem;color:var(--muted);flex-basis:100%}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.switch{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--rule);border-radius:13px;position:relative;cursor:pointer;margin:0;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:right .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{right:21px}
.keys{direction:ltr;position:relative;height:120px;display:flex;margin:4px 0 12px;user-select:none;-webkit-user-select:none}
.keys .w{flex:1;background:var(--key-w);border:1px solid var(--rule);border-radius:0 0 6px 6px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:.75rem;color:#555;font-family:var(--f-body)}
.keys .b{position:absolute;top:0;width:9%;height:62%;background:var(--key-b);border-radius:0 0 4px 4px;cursor:pointer;transform:translateX(-50%)}
.keys .w:active,.keys .w.hit{background:var(--accent-soft)}
.keys .b:active,.keys .b.hit{background:var(--accent)}
.note{font-size:.85rem;color:var(--muted)}
.warn{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">→ כל התרגילים</a>
  <header>
    <h1>תווים בקצב</h1>
    <div class="mic"><span class="dot" id="micDot"></span><span id="micTxt">מיקרופון כבוי</span></div>
  </header>

  <div class="seg" role="group" aria-label="מצב תרגול">
    <button id="m-single" data-mode="single">תו בודד</button>
    <button id="m-fifths" data-mode="fifths">קווינטות</button>
    <button id="m-triads" data-mode="triads">משולשים</button>
  </div>

  <div class="card">
    <svg class="staff" id="staff" viewBox="0 0 360 180" role="img" aria-label="חמשה"></svg>
    <div class="label" id="label"></div>
    <div class="prompt" id="prompt">לחץ "התחל", תקבל ארבע פעמות ספירה ואז התו הראשון.</div>
    <div class="beats" id="beats"></div>
    <div class="bar"><span id="bar"></span></div>
    <div class="heard"><span>שומע: <b id="heardNote">—</b></span><div class="meter"><span id="meter"></span></div></div>
  </div>

  <div id="warn" class="warn" hidden></div>

  <div class="transport">
    <button class="go" id="go">התחל</button>
    <div class="tempo">
      <div class="tempo-top"><span class="bpm"><span id="bpmVal">50</span> <small>BPM</small></span>
        <span class="row" style="flex-wrap:nowrap;gap:6px"><label for="auto" style="font-size:.85rem">קצב עולה</label><input type="checkbox" class="switch" id="auto" checked></span></div>
      <input type="range" id="bpm" min="30" max="180" step="1" value="50" aria-label="קצב">
    </div>
  </div>

  <div class="stats">
    <div><b id="sOk">0</b><span>נכונים</span></div>
    <div><b id="sMiss">0</b><span>פספוסים</span></div>
    <div><b id="sStreak">0</b><span>רצף</span></div>
    <div><b id="sBest">0</b><span>שיא רצף</span></div>
  </div>

  <details id="setDetails">
    <summary>הגדרות</summary>
    <div class="grid">
      <div class="row"><label for="clef">מפתח</label>
        <select id="clef"><option value="treble">סול (יד ימין)</option><option value="bass">פה (יד שמאל)</option><option value="both">שניהם</option></select></div>
      <div class="row"><label for="names">שמות התווים</label>
        <select id="names"><option value="after">להראות אחרי הניגון</option><option value="always">להראות תמיד</option><option value="never">לא להראות</option></select></div>
      <div class="row"><label for="naming">שיטת שמות</label>
        <select id="naming"><option value="sol">דו רה מי</option><option value="let">C D E</option></select></div>
      <div class="row"><label for="acc">דיאזים ובמולים</label><input type="checkbox" class="switch" id="acc"></div>
      <div class="row"><label for="beatsPer">פעמות לכל תו</label>
        <select id="beatsPer"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option></select></div>
      <div class="row"><label for="fifthDir">כיוון הקווינטה</label>
        <select id="fifthDir"><option value="up">עולה</option><option value="down">יורדת</option><option value="both">שניהם</option></select></div>
      <div class="row"><label for="quality">סוג משולש</label>
        <select id="quality"><option value="both">מז'ור ומינור</option><option value="maj">מז'ור</option><option value="min">מינור</option></select></div>
      <div class="row"><label for="exactOct">לדרוש אוקטבה מדויקת</label><input type="checkbox" class="switch" id="exactOct">
        <span class="hint">כבוי כברירת מחדל, כי זיהוי במיקרופון מתבלבל לפעמים באוקטבה בתווים נמוכים.</span></div>
      <div class="row"><label for="click">צליל מטרונום</label><input type="checkbox" class="switch" id="click" checked></div>
      <div class="row"><label for="sens">רגישות מיקרופון</label><input type="range" id="sens" min="1" max="10" value="6" style="max-width:180px"></div>
    </div>
  </details>

  <details id="kbDetails">
    <summary>מקלדת על המסך</summary>
    <p class="note" style="margin:0">לתרגול בלי מיקרופון או לבדיקה. נבדק לפי שם התו בלבד, בלי אוקטבה.</p>
    <div class="keys" id="keys"></div>
  </details>
</div>

<script>
(() => {
'use strict';
const LET = ['C','D','E','F','G','A','B'];
const SOL = ['דו','רה','מי','פה','סול','לה','סי'];
const NAT = [0,2,4,5,7,9,11];
const ACC = {'-1':'♭','0':'','1':'♯'};
const SHARP_PC = [[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
const $ = id => document.getElementById(id);

// ---------- settings ----------
const defaults = {mode:'single', clef:'treble', names:'after', naming:'sol', acc:false, beatsPer:4,
  fifthDir:'up', quality:'both', exactOct:false, click:true, sens:6, bpm:50, auto:true};
let S = Object.assign({}, defaults);
try { const saved = JSON.parse(localStorage.getItem('piano-trainer') || '{}'); Object.assign(S, saved); } catch(e) {}
function save(){ try { localStorage.setItem('piano-trainer', JSON.stringify(S)); } catch(e) {} }

// ---------- music model ----------
const natMidi = (l, o) => 12*(o+1) + NAT[l];
function mk(l, a, o){ return {letter:l, acc:a, oct:o, midi:natMidi(l,o)+a, step:o*7+l}; }
function shift(n, steps, semis){
  let l = n.letter + steps, o = n.oct + Math.floor(l/7);
  l = ((l%7)+7)%7;
  const a = n.midi + semis - natMidi(l,o);
  if (Math.abs(a) > 1) return null;
  return mk(l, a, o);
}
function nameOf(n, withOct){
  const base = S.naming === 'sol' ? SOL[n.letter] : LET[n.letter];
  return base + ACC[n.acc] + (withOct && S.naming === 'let' ? n.oct : '');
}
function midiName(m){
  const [l,a] = SHARP_PC[((m%12)+12)%12], o = Math.floor(m/12)-1;
  return (S.naming === 'sol' ? SOL[l] : LET[l]) + ACC[a] + (S.naming === 'let' ? o : '');
}
const CLEFS = {
  treble:{bottom:30, lo:26, hi:42, rLo:28, rHi:40, glyph:'𝄞'},
  bass:  {bottom:18, lo:14, hi:30, rLo:16, rHi:28, glyph:'𝄢'}
};
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function randomRoot(c){
  const step = rnd(c.rLo, c.rHi), l = ((step%7)+7)%7, o = Math.floor(step/7);
  let a = 0;
  if (S.acc && Math.random() < 0.4){
    a = pick([-1,1]);
    if ((a === 1 && (l === 2 || l === 6)) || (a === -1 && (l === 0 || l === 3))) a = 0;
  }
  return mk(l, a, o);
}

let prevItem = null;
function genItem(){
  for (let tries = 0; tries < 400; tries++){
    const clefKey = S.clef === 'both' ? pick(['treble','bass']) : S.clef;
    const c = CLEFS[clefKey];
    const root = randomRoot(c);
    let notes, label, kind = S.mode, quality = null, dir = null;
    if (S.mode === 'single'){ notes = [root]; }
    else if (S.mode === 'fifths'){
      dir = S.fifthDir === 'both' ? pick(['up','down']) : S.fifthDir;
      const f = dir === 'up' ? shift(root, 4, 7) : shift(root, -4, -7);
      if (!f) continue;
      notes = [root, f];
    } else {
      quality = S.quality === 'both' ? pick(['maj','min']) : S.quality;
      const third = shift(root, 2, quality === 'maj' ? 4 : 3), fifth = shift(root, 4, 7);
      if (!third || !fifth) continue;
      notes = [root, third, fifth];
    }
    if (!S.acc && notes.some(n => n.acc !== 0)) continue;
    if (notes.some(n => n.step < c.lo || n.step > c.hi)) continue;
    if (prevItem){
      const prevPcs = prevItem.notes.map(n => ((n.midi%12)+12)%12);
      if (prevPcs.includes(((notes[0].midi%12)+12)%12)) continue;
    }
    return {notes, clef:clefKey, kind, quality, dir, idx:0, done:false, missed:false, errors:0, started:false};
  }
  return null;
}
function itemLabel(it){
  if (it.kind === 'single') return nameOf(it.notes[0], true);
  if (it.kind === 'fifths') return nameOf(it.notes[0]) + (it.dir === 'up' ? ' ↗ ' : ' ↘ ') + nameOf(it.notes[1]);
  return nameOf(it.notes[0]) + ' ' + (it.quality === 'maj' ? "מז'ור" : 'מינור') + ' · ' + it.notes.map(n => nameOf(n)).join(' ');
}
function itemPrompt(it){
  if (it.kind === 'single') return 'נגן את התו';
  if (it.kind === 'fifths') return it.dir === 'up' ? 'קווינטה עולה: נגן את שני התווים, משמאל לימין' : 'קווינטה יורדת: נגן את שני התווים, משמאל לימין';
  return (it.quality === 'maj' ? "משולש מז'ור" : 'משולש מינור') + ': נגן תו אחר תו, מהבס למעלה';
}

// ---------- staff drawing ----------
const NS = 'http://www.w3.org/2000/svg';
const GAP = 12, HALF = 6, BOTTOM_Y = 118, X0 = 18, X1 = 342;
function el(tag, attrs, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function drawStaff(it, reveal){
  const svg = $('staff'); svg.textContent = '';
  const clefKey = it ? it.clef : (S.clef === 'bass' ? 'bass' : 'treble');
  const c = CLEFS[clefKey];
  for (let i = 0; i < 5; i++) svg.appendChild(el('line', {x1:X0, x2:X1, y1:BOTTOM_Y - i*GAP, y2:BOTTOM_Y - i*GAP, stroke:'var(--ink)', 'stroke-width':1.2, opacity:.75}));
  svg.appendChild(el('line', {x1:X0, x2:X0, y1:BOTTOM_Y-4*GAP, y2:BOTTOM_Y, stroke:'var(--ink)', 'stroke-width':1.2, opacity:.75}));
  svg.appendChild(el('line', {x1:X1, x2:X1, y1:BOTTOM_Y-4*GAP, y2:BOTTOM_Y, stroke:'var(--ink)', 'stroke-width':1.2, opacity:.75}));
  if (clefKey === 'treble') svg.appendChild(el('text', {x:24, y:BOTTOM_Y-GAP+1, 'font-size':76, fill:'var(--ink)', 'font-family':'var(--f-music)'}, c.glyph));
  else svg.appendChild(el('text', {x:26, y:BOTTOM_Y-3*GAP+1, 'font-size':50, fill:'var(--ink)', 'font-family':'var(--f-music)'}, c.glyph));
  if (!it) return;
  const n = it.notes.length;
  const xs = n === 1 ? [210] : n === 2 ? [170, 260] : [150, 220, 290];
  const topStep = c.bottom + 8;
  it.notes.forEach((note, i) => {
    const x = xs[i], y = BOTTOM_Y - (note.step - c.bottom)*HALF;
    const played = i < it.idx, current = i === it.idx && !it.done && it.started;
    const col = played ? 'var(--ok)' : (it.missed ? 'var(--bad)' : (current ? 'var(--accent)' : 'var(--ink)'));
    for (let s = c.bottom - 2; s >= note.step; s -= 2) svg.appendChild(el('line', {x1:x-14, x2:x+14, y1:BOTTOM_Y-(s-c.bottom)*HALF, y2:BOTTOM_Y-(s-c.bottom)*HALF, stroke:'var(--ink)', 'stroke-width':1.2}));
    for (let s = topStep + 2; s <= note.step; s += 2) svg.appendChild(el('line', {x1:x-14, x2:x+14, y1:BOTTOM_Y-(s-c.bottom)*HALF, y2:BOTTOM_Y-(s-c.bottom)*HALF, stroke:'var(--ink)', 'stroke-width':1.2}));
    if (note.acc) svg.appendChild(el('text', {x:x-26, y:y+7, 'font-size':22, fill:col, 'font-family':'var(--f-music)'}, ACC[note.acc]));
    const g = el('g', {transform:`translate(${x} ${y}) rotate(-22)`});
    g.appendChild(el('ellipse', {cx:0, cy:0, rx:8.2, ry:5.6, fill:'none', stroke:col, 'stroke-width':current ? 3 : 2.4}));
    svg.appendChild(g);
    if (reveal || played) svg.appendChild(el('text', {x, y:172, 'text-anchor':'middle', 'font-size':15, fill:played ? 'var(--ok)' : 'var(--muted)', 'font-family':'var(--f-body)', 'font-weight':700}, nameOf(note)));
  });
}

// ---------- UI refs ----------
const modeBtns = document.querySelectorAll('.seg button');
function syncModeBtns(){ modeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode))); }
['clef','names','naming','fifthDir','quality'].forEach(k => { $(k).value = S[k]; $(k).addEventListener('change', e => { S[k] = e.target.value; save(); onSettingsChange(); }); });
['acc','exactOct','click','auto'].forEach(k => { $(k).checked = !!S[k]; $(k).addEventListener('change', e => { S[k] = e.target.checked; save(); onSettingsChange(); }); });
$('beatsPer').value = String(S.beatsPer);
$('beatsPer').addEventListener('change', e => { S.beatsPer = +e.target.value; save(); renderBeats(); });
$('sens').value = S.sens; $('sens').addEventListener('input', e => { S.sens = +e.target.value; save(); });
$('bpm').value = S.bpm; $('bpmVal').textContent = S.bpm;
$('bpm').addEventListener('input', e => { S.bpm = +e.target.value; $('bpmVal').textContent = S.bpm; save(); });
modeBtns.forEach(b => b.addEventListener('click', () => { S.mode = b.dataset.mode; save(); syncModeBtns(); onSettingsChange(); }));
syncModeBtns();
function setBpm(v){ S.bpm = Math.max(30, Math.min(180, Math.round(v))); $('bpm').value = S.bpm; $('bpmVal').textContent = S.bpm; save(); }

function onSettingsChange(){
  // a new setting applies from the next item; when idle, show a fresh preview
  if (!running){ prevItem = null; item = genItem(); renderItem(); }
  else pendingRegen = true;
}
let pendingRegen = false;

function setPrompt(text, cls){ const p = $('prompt'); p.textContent = text; p.className = 'prompt' + (cls ? ' ' + cls : ''); }
function renderItem(){
  const reveal = item && (S.names === 'always' || (S.names === 'after' && (item.done || item.missed)));
  drawStaff(item, reveal);
  $('label').textContent = item && reveal ? itemLabel(item) : '';
  renderBeats();
}
function renderBeats(){
  const total = item ? S.beatsPer * item.notes.length : S.beatsPer;
  const b = $('beats');
  if (b.childElementCount !== total){ b.textContent = ''; for (let i = 0; i < total; i++) b.appendChild(document.createElement('i')); }
  [...b.children].forEach((d, i) => { d.className = !running || !item || !item.started ? '' : (i < beatsElapsed-1 ? 'past' : (i === beatsElapsed-1 ? 'now' : '')); });
}
const stats = {ok:0, miss:0, streak:0, best:0};
function renderStats(){ $('sOk').textContent = stats.ok; $('sMiss').textContent = stats.miss; $('sStreak').textContent = stats.streak; $('sBest').textContent = stats.best; }

// ---------- audio ----------
let ctx = null, analyser = null, stream = null, buf = null, lastClick = -1;
function ensureCtx(){ if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); }
function click(accent){
  if (!S.click) return;
  const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = accent ? 2400 : 1700;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(accent ? 0.5 : 0.28, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.05);
  lastClick = t;
}
function tone(midi){
  ensureCtx();
  const t = ctx.currentTime, f = 440 * Math.pow(2, (midi-69)/12);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+1.2);
  [1,2,3].forEach((h, i) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f*h; const hg = ctx.createGain(); hg.gain.value = [1,.35,.15][i]; o.connect(hg).connect(g); o.start(t); o.stop(t+1.25); });
  g.connect(ctx.destination);
}
async function initMic(){
  if (analyser) return true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showWarn('הדפדפן לא נותן גישה למיקרופון כאן. אפשר לתרגל עם המקלדת שעל המסך.'); return false; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 4096;
    src.connect(analyser);
    buf = new Float32Array(analyser.fftSize);
    $('micDot').classList.add('on'); $('micTxt').textContent = 'מקשיב';
    $('warn').hidden = true;
    return true;
  } catch(e){
    showWarn('אין גישה למיקרופון (' + (e.name || 'שגיאה') + '). אפשר לאשר הרשאה בדפדפן ולנסות שוב, או לתרגל עם המקלדת שעל המסך.');
    $('kbDetails').open = true;
    return false;
  }
}
function stopMic(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; analyser = null;
  $('micDot').classList.remove('on'); $('micTxt').textContent = 'מיקרופון כבוי';
}
function showWarn(t){ const w = $('warn'); w.textContent = t; w.hidden = false; }

// YIN pitch detection
const W = 2048; let yinD = null;
function yin(x, sr){
  const tauMin = Math.floor(sr/1200), tauMax = Math.min(Math.floor(sr/60), x.length - W - 1);
  if (!yinD || yinD.length < tauMax+1) yinD = new Float32Array(tauMax+1);
  const d = yinD; d[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax; tau++){
    let s = 0;
    for (let i = 0; i < W; i++){ const v = x[i] - x[i+tau]; s += v*v; }
    run += s;
    d[tau] = run ? s * tau / run : 1;
  }
  let tau = -1;
  for (let t = tauMin; t < tauMax; t++){
    if (d[t] < 0.13){ while (t+1 < tauMax && d[t+1] < d[t]) t++; tau = t; break; }
  }
  if (tau < 0) return null;
  const a = d[tau-1], b = d[tau], c = d[tau+1];
  const den = a + c - 2*b;
  const shiftT = den ? (a - c) / (2*den) : 0;
  return sr / (tau + shiftT);
}

let cand = null, candCount = 0, lastAccepted = null, silentFrames = 0, rmsSlow = 0, frame = 0;
function listen(){
  if (!analyser) return;
  frame++;
  analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i]*buf[i];
  const rms = Math.sqrt(sum / buf.length);
  $('meter').style.width = Math.min(100, rms*600) + '%';
  const gate = 0.004 + (10 - S.sens) * 0.004;
  if (rms > gate && rms > rmsSlow * 1.8){ lastAccepted = null; candCount = 0; }   // new key strike
  rmsSlow = rmsSlow*0.85 + rms*0.15;
  if (rms < gate){ if (++silentFrames > 6){ lastAccepted = null; cand = null; candCount = 0; $('heardNote').textContent = '—'; } return; }
  silentFrames = 0;
  if (ctx.currentTime - lastClick < 0.08) return;
  if (frame % 2) return;
  const f = yin(buf, ctx.sampleRate);
  if (!f) return;
  const m = 69 + 12*Math.log2(f/440), r = Math.round(m);
  if (r < 28 || r > 100) return;
  $('heardNote').textContent = midiName(r);
  if (r === cand) candCount++; else { cand = r; candCount = 1; }
  if (candCount === 3 && r !== lastAccepted){ lastAccepted = r; heard(r, 'mic'); }
}

// ---------- practice engine ----------
let running = false, item = null, beatsElapsed = 0, countIn = 0, nextBeat = 0, itemStart = 0, flashTimer = 0;
function heard(midi, src){
  if (!running || !item || !item.started || item.done || item.missed) return;
  const exp = item.notes[item.idx];
  const samePc = ((midi - exp.midi) % 12 + 12) % 12 === 0;
  const ok = (src === 'tap' || !S.exactOct) ? samePc : midi === exp.midi;
  if (ok){
    item.idx++;
    if (item.idx === item.notes.length){
      item.done = true;
      stats.ok++; stats.streak++; stats.best = Math.max(stats.best, stats.streak);
      if (S.auto && stats.streak % 3 === 0) setBpm(S.bpm + 4);
      setPrompt(item.errors ? 'הגעת. בפעם הבאה בלי טעויות בדרך' : 'יפה!', 'ok');
      renderStats();
    }
    renderItem();
  } else {
    const done = item.notes.slice(0, item.idx).some(n => ((n.midi - midi) % 12 + 12) % 12 === 0);
    if (done) return;               // still hearing a note already played
    item.errors++;
    setPrompt('זה ' + midiName(midi) + ', לא התו הנכון', 'bad');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { if (item && !item.done && !item.missed) setPrompt(itemPrompt(item)); }, 900);
  }
}
function nextItem(){
  prevItem = item; pendingRegen = false;
  item = genItem(); item.started = true;
  beatsElapsed = 1; itemStart = ctx.currentTime;
  lastAccepted = cand;  // a still-ringing note does not count for the new item
  setPrompt(itemPrompt(item));
  renderItem();
}
function onBeat(){
  if (countIn > 0){
    click(countIn === 4);
    setPrompt('מתחילים בעוד ' + countIn + '…');
    countIn--;
    return;
  }
  if (!item.started){ item.started = true; beatsElapsed = 1; itemStart = ctx.currentTime; click(true); setPrompt(itemPrompt(item)); renderItem(); return; }
  const total = S.beatsPer * item.notes.length;
  if (item.done || beatsElapsed >= total){
    if (!item.done){
      item.missed = true; stats.miss++; stats.streak = 0;
      if (S.auto) setBpm(S.bpm - 6);
      renderStats();
    }
    const missedItem = item.missed ? item : null;
    nextItem(); click(true);
    if (missedItem){
      setPrompt('פספוס. זה היה ' + itemLabel(missedItem), 'bad');
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { if (item && !item.done) setPrompt(itemPrompt(item)); }, 1600);
    }
    return;
  }
  if (item.missed) return;
  beatsElapsed++; click(false); renderBeats();
}
function tick(){
  if (ctx){
    listen();
    if (running){
      const now = ctx.currentTime;
      if (now >= nextBeat){
        onBeat();
        nextBeat += 60 / S.bpm;
        if (nextBeat < now) nextBeat = now + 60 / S.bpm;
      }
      if (item && item.started && !item.done){
        const total = S.beatsPer * item.notes.length * 60 / S.bpm;
        $('bar').style.width = Math.min(100, (now - itemStart) / total * 100) + '%';
      } else if (item && item.done) $('bar').style.width = '100%';
    }
  }
  requestAnimationFrame(tick);
}
let wakeLock = null;
async function start(){
  ensureCtx();
  await initMic();
  stats.ok = stats.miss = stats.streak = 0; renderStats();
  prevItem = null; item = genItem();
  countIn = 4; beatsElapsed = 0; running = true;
  nextBeat = ctx.currentTime + 0.25;
  $('go').textContent = 'עצור'; $('go').classList.add('stop');
  renderItem();
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function stop(){
  running = false;
  $('go').textContent = 'התחל'; $('go').classList.remove('stop');
  $('bar').style.width = '0';
  setPrompt('עצרת. ' + stats.ok + ' נכונים מתוך ' + (stats.ok + stats.miss) + '.');
  stopMic();
  if (item){ item.started = false; }
  renderItem();
  try { wakeLock && wakeLock.release(); } catch(e) {}
}
$('go').addEventListener('click', () => running ? stop() : start());

// ---------- on-screen keyboard ----------
(function buildKeys(){
  const k = $('keys');
  const whites = [0,2,4,5,7,9,11];
  whites.forEach((pc, i) => {
    const d = document.createElement('div'); d.className = 'w'; d.dataset.pc = pc;
    d.textContent = S.naming === 'sol' ? SOL[i] : LET[i];
    k.appendChild(d);
  });
  [[1,1],[3,2],[6,4],[8,5],[10,6]].forEach(([pc, after]) => {
    const d = document.createElement('div'); d.className = 'b'; d.dataset.pc = pc;
    d.style.left = (after / 7 * 100) + '%';
    k.appendChild(d);
  });
  k.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-pc]'); if (!t) return;
    e.preventDefault();
    const midi = 60 + (+t.dataset.pc);
    if (!analyser) tone(midi);
    t.classList.add('hit'); setTimeout(() => t.classList.remove('hit'), 150);
    $('heardNote').textContent = midiName(midi).replace(/\d+$/, '');
    heard(midi, 'tap');
  });
})();

item = genItem();
renderItem(); renderStats();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
